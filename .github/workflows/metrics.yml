# Renders metrics.languages.svg and metrics.isocalendar.svg with lowlighter/metrics.
# Needs a repository secret METRICS_TOKEN (classic personal access token, scopes: read:user, repo is optional).
name: Metrics
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency: metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Languages and lines of code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: metrics.languages.svg
          user: yungzyx
          template: classic
          base: ""
          config_timezone: America/Santiago
          plugin_languages: yes
          plugin_languages_ignored: html, css, shell, makefile, plpgsql, dockerfile, mako, jupyter notebook
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_lines: yes

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: metrics.isocalendar.svg
          user: yungzyx
          template: classic
          base: ""
          config_timezone: America/Santiago
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
