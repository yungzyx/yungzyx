# Renders the metrics.*.svg images with lowlighter/metrics.
# Needs a repository secret METRICS_TOKEN (classic personal access token, scope: read:user).
name: Metrics
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency: metrics

env:
  USER: yungzyx
  TZ_NAME: America/Santiago

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Full-year 3D contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: metrics.isocalendar.svg
          user: ${{ env.USER }}
          template: classic
          base: ""
          config_timezone: ${{ env.TZ_NAME }}
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages and lines of code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: metrics.languages.svg
          user: ${{ env.USER }}
          template: classic
          base: ""
          config_timezone: ${{ env.TZ_NAME }}
          plugin_languages: yes
          plugin_languages_ignored: html, css, shell, makefile, plpgsql, dockerfile, mako, jupyter notebook
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_lines: yes
          plugin_lines_sections: history

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: metrics.achievements.svg
          user: ${{ env.USER }}
          template: classic
          base: ""
          config_timezone: ${{ env.TZ_NAME }}
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
