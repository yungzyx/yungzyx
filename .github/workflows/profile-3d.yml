# Draws the 3D contribution towers into profile-3d-contrib/ with yoshi389111/github-profile-3d-contrib.
name: Profile 3D
on:
  schedule: [{ cron: "0 7 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-3d.yml]

permissions:
  contents: write

concurrency: profile-3d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Update 3D contribution chart [skip ci]"; then
            git pull --rebase && git push
          fi
