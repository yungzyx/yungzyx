# Draws the contribution-graph snake and publishes it to the `output` branch.
name: Snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#8A00C2&color_dots=#ebedf0,#b3f5dc,#4de0a8,#00a86b,#007a4d
            dist/snake-dark.svg?palette=github-dark&color_snake=#BD00FF&color_dots=#161b22,#00402a,#00875a,#00c87d,#00ff9f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
