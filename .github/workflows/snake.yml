# Draws the contribution-graph snake and publishes it to the `output` branch.
name: Snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#15803D&color_dots=#ebedf0,#bbf7d0,#4ade80,#16a34a,#14532d
            dist/snake-dark.svg?palette=github-dark&color_snake=#22C55E&color_dots=#161b22,#14532d,#15803d,#22c55e,#86efac

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
