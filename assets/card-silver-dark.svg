<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="t d">
<title id="t">Silver Minds</title>
<desc id="d">Silver Minds: a screen-and-voice assistant for older adults built at Hack4Seniors UDD. The model proposes and the person confirms: memories, activity ideas and invitations only go out with their approval, and a safety check runs before any suggestion. FastAPI, Postgres with pgvector, RAG.</desc>
