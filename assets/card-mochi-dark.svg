<title id="t">Mochi · rappi-dlab</title>
<desc id="d">Mochi: a multivertical recommendation engine and app prototype built in the dLab program with Rappi Chile. Suggests the next vertical (Restaurants, Turbo, Retail) with a visible reason. FastAPI, Postgres with pgvector, React 19, Docker.</desc>
