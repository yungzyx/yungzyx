<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="t d">
<title id="t">Rako</title>
<desc id="d">Rako: a raccoon desk robot running on a Raspberry Pi 4 that helps university students get back into their routine with voice conversation, focus sessions, expressive OLED eyes and local memory.</desc>
<style>
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.next{animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.eye,.next{animation:none!important}}
</style>
<rect x="1" y="1" width="478" height="258" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#007A4D"/><stop offset=".5" stop-color="#0072A8"/><stop offset="1" stop-color="#8A00C2"/></linearGradient></defs>
<rect x="1" y="1" width="6" height="258" rx="3" fill="url(#g)"/>
<text x="28" y="44" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.2" fill="#007A4D">PHYSICAL AI · RASPBERRY PI 4</text>
<text x="28" y="80" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#0F172A">Rako</text>
<text x="452" y="80" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#475569">↗</text>
<text x="28" y="108" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#475569">A raccoon desk companion that helps university</text><text x="28" y="128" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#475569">students get back into their routine: voice chat,</text><text x="28" y="148" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#475569">focus sessions, OLED eyes and on-device memory.</text>
<rect x="28" y="160" width="104" height="42" rx="8" fill="#05070A" stroke="#CBD5E1" stroke-width="1.5"/><rect class="eye" x="50" y="170" width="22" height="22" rx="7" fill="#00B8FF"/><rect class="eye" x="88" y="170" width="22" height="22" rx="7" fill="#00B8FF"/><circle cx="152" cy="181" r="5" fill="#007A4D"/><text x="166" y="186" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#0F172A">listening</text><text x="252" y="186" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#475569">· focus 25:00</text>
<line x1="28" y1="216" x2="452" y2="216" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="28" y="240" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#475569">Python · voice · OLED · local memory · safety layer</text>
