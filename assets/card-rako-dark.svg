<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="t d">
<title id="t">Rako</title>
<desc id="d">Rako: a raccoon desk robot running on a Raspberry Pi 4 that helps university students get back into their routine with voice conversation, focus sessions, expressive OLED eyes and local memory.</desc>
<style>
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.next{animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.eye,.next{animation:none!important}}
</style>
